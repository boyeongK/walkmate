<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8c42" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="산책메이트" />
  <link rel="manifest" href="manifest.json" />
  <title>산책메이트 - 반려동물 프로필</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <div class="app_frame">
    <header class="app_header">
      <p class="header_title">반려동물 프로필 등록</p>
      <p class="header_subtitle">정확히 입력할수록 AI 매칭 궁합 점수가 정교해져요.</p>
    </header>

    <main class="app_main">
      <section class="card profile_pet_switcher_card" data-pet-switcher-wrap hidden>
        <div data-pet-switcher></div>
      </section>

      <form class="card profile_form" data-profile-form>
        <div class="form_group profile_photo_group">
          <p class="form_label">프로필 사진</p>
          <div class="profile_photo_row">
            <div class="profile_photo_wrap">
              <div class="profile_photo_preview" data-profile-photo-preview>
                <span class="profile_photo_placeholder pet_avatar_placeholder" data-profile-photo-placeholder aria-hidden="true">🐕</span>
                <img class="profile_photo_image" data-profile-photo-image alt="반려동물 프로필 사진" hidden />
              </div>
              <button type="button" class="profile_photo_edit_button" data-profile-photo-menu-button aria-label="프로필 사진 설정" aria-expanded="false" aria-haspopup="true">
                <svg class="profile_photo_edit_icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M19.3 13.1a7.3 7.3 0 0 0 .1-2.2l2-1.5-2-3.5-2.4 1a7.5 7.5 0 0 0-1.9-1.1L15 3h-4l-.2 2.8a7.5 7.5 0 0 0-1.9 1.1l-2.4-1-2 3.5 2 1.5a7.3 7.3 0 0 0 0 2.2l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 0 0 1.9 1.1L11 21h4l.2-2.8a7.5 7.5 0 0 0 1.9-1.1l2.4 1 2-3.5-2-1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="profile_photo_menu" data-profile-photo-menu hidden role="menu">
                <button type="button" class="profile_photo_menu_item" data-profile-photo-button role="menuitem">사진 등록/변경</button>
                <button type="button" class="profile_photo_menu_item profile_photo_menu_item_danger" data-profile-photo-remove hidden role="menuitem">사진 삭제</button>
              </div>
            </div>
          </div>
          <p class="form_error" data-profile-photo-error hidden></p>
        </div>

        <div class="form_group">
          <label class="form_label" for="pet_name">반려동물 이름</label>
          <input class="form_input" type="text" id="pet_name" name="name" placeholder="예: 몽이" required />
        </div>

        <div class="form_group">
          <label class="form_label" for="pet_breed">견종</label>
          <input class="form_input" type="text" id="pet_breed" name="breed" placeholder="예: 말티즈" required />
        </div>

        <div class="form_group">
          <label class="form_label" for="pet_age">나이</label>
          <input class="form_input" type="number" id="pet_age" name="age" min="0" max="30" placeholder="예: 3" />
        </div>

        <div class="form_group">
          <label class="form_label" for="pet_size">크기</label>
          <select class="form_select" id="pet_size" name="size" required>
            <option value="">선택해주세요</option>
            <option value="소형">소형</option>
            <option value="중형">중형</option>
            <option value="대형">대형</option>
          </select>
        </div>

        <div class="form_group">
          <label class="form_label" for="pet_energy">활동량</label>
          <select class="form_select" id="pet_energy" name="energyLevel" required>
            <option value="">선택해주세요</option>
            <option value="낮음">낮음 - 짧고 느긋한 산책 선호</option>
            <option value="중간">중간 - 보통 속도의 산책</option>
            <option value="높음">높음 - 활발하고 긴 산책 선호</option>
          </select>
        </div>

        <div class="form_group">
          <label class="form_label">성향 태그 (중복 선택 가능)</label>
          <div class="chip_select_group" data-tag-group>
            <button type="button" class="chip_select_option" data-tag="활발함">활발함</button>
            <button type="button" class="chip_select_option" data-tag="온순함">온순함</button>
            <button type="button" class="chip_select_option" data-tag="사람좋아함">사람좋아함</button>
            <button type="button" class="chip_select_option" data-tag="다른개좋아함">다른개좋아함</button>
            <button type="button" class="chip_select_option" data-tag="장난기많음">장난기많음</button>
            <button type="button" class="chip_select_option" data-tag="애교많음">애교많음</button>
            <button type="button" class="chip_select_option" data-tag="겁많음">겁많음</button>
            <button type="button" class="chip_select_option" data-tag="독립적임">독립적임</button>
            <button type="button" class="chip_select_option" data-tag="훈련잘됨">훈련잘됨</button>
            <button type="button" class="chip_select_option" data-tag="짖음적음">짖음적음</button>
            <button type="button" class="chip_select_option" data-tag="호기심많음">호기심많음</button>
            <button type="button" class="chip_select_option" data-tag="소형견선호">소형견선호</button>
            <button type="button" class="chip_select_option" data-tag="대형견선호">대형견선호</button>
            <button type="button" class="chip_select_option" data-tag="장거리산책">장거리산책</button>
            <button type="button" class="chip_select_option" data-tag="짧은산책선호">짧은산책선호</button>
          </div>

          <div class="custom_tag_input_row">
            <input class="form_input" type="text" data-custom-tag-input placeholder="기타 성향 직접 입력 (예: 목줄끌기심함)" maxlength="12" />
            <button type="button" class="btn_outline btn_small" data-add-tag-button>추가</button>
          </div>
          <p class="form_helper">목록에 없는 성향은 직접 입력해서 추가할 수 있어요.</p>
        </div>

        <p class="form_error" data-error-message hidden></p>

        <button type="button" class="btn_outline profile_delete_pet_button" data-delete-pet-button hidden>이 반려동물 프로필 삭제</button>
        <button type="submit" class="btn_primary" data-profile-submit-button>프로필 저장하고 시작하기</button>
      </form>
    </main>

    <nav class="bottom_nav">
      <a class="nav_item" href="home.html"><span class="nav_icon">🏠</span>홈</a>
      <a class="nav_item" href="matching.html"><span class="nav_icon">💞</span>AI매칭</a>
      <a class="nav_item" href="requests.html"><span class="nav_icon">📋</span>요청</a>
      <a class="nav_item" href="history.html"><span class="nav_icon">🕓</span>이력</a>
      <a class="nav_item is_active" href="profile.html"><span class="nav_icon">🐾</span>프로필</a>
    </nav>
  </div>

  <script src="js/app-config.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/camera-helper.js"></script>
  <script src="js/pet-ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
