<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8c42" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="산책메이트" />
  <link rel="manifest" href="manifest.json" />
  <title>산책메이트 - 추천 산책 짝</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div class="app_frame">
    <header class="app_header home_header">
      <div>
        <p class="header_title" data-greeting>안녕하세요 👋</p>
        <p class="header_subtitle">AI가 추천하는 오늘의 산책 짝을 확인해보세요.</p>
      </div>
      <button type="button" class="btn_text btn_small" data-logout-button>계정 전환</button>
    </header>

    <main class="app_main">
      <section class="card my_pet_summary" data-my-pet-summary hidden></section>

      <section class="pet_switcher_bar" data-pet-switcher hidden></section>

      <h2 class="section_title">추천 산책 짝</h2>
      <ul class="match_list" data-match-list></ul>
    </main>

    <nav class="bottom_nav">
      <a class="nav_item is_active" href="home.html"><span class="nav_icon">🏠</span>홈</a>
      <a class="nav_item" href="matching.html"><span class="nav_icon">💞</span>AI매칭</a>
      <a class="nav_item" href="requests.html"><span class="nav_icon">📋</span>요청</a>
      <a class="nav_item" href="history.html"><span class="nav_icon">🕓</span>이력</a>
      <a class="nav_item" href="profile.html"><span class="nav_icon">🐾</span>프로필</a>
    </nav>
  </div>

  <script src="js/app-config.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/pet-ui.js"></script>
  <script src="js/match-explainer.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
